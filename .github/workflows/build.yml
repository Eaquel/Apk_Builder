name: Build and verify

on:
  push:
    branches:
      - Main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_BUILDER_RUST_VERSION: "1.97.1"
  APK_BUILDER_JDK_VERSION: "25"
  APK_BUILDER_NDK_VERSION: "29.0.14206865"
  APK_BUILDER_BUILD_TOOLS_VERSION: "36.0.0"
  APK_BUILDER_ANDROID_API: "36"
  APK_BUILDER_CMAKE_VERSION: "4.4.2"
  APK_BUILDER_CMAKE_SHA256: "3ada9a3f5d8a85413579bdd0ea6aa8e8da86efdd6d15c91a1afa517f2021956c"
  APK_BUILDER_SDK_CMAKE_FOR_NINJA: "4.1.2"

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.APK_BUILDER_JDK_VERSION }}

      - name: Install the pinned build tools
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"
          "$sdkmanager" "build-tools;$APK_BUILDER_BUILD_TOOLS_VERSION"
          test -x "$ANDROID_HOME/build-tools/$APK_BUILDER_BUILD_TOOLS_VERSION/apksigner"

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$APK_BUILDER_RUST_VERSION" \
            --profile minimal --component rustfmt --component clippy
          rustup default "$APK_BUILDER_RUST_VERSION"
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "$APK_BUILDER_RUST_VERSION"

      - name: Run every check that needs no Android build
        run: ./Builder_Test.py --strict layout format lint dependencies strings core

  apk:
    name: Builder APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install the pinned JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.APK_BUILDER_JDK_VERSION }}
          # The Gradle distribution, the Android Gradle Plugin and the Kotlin
          # compiler are the same bytes every run. Fetching them again each
          # time is the longest thing this job does before it builds anything.
          cache: gradle

      - name: Install the pinned Rust toolchain and Android targets
        run: |
          set -euo pipefail
          rustup toolchain install "$APK_BUILDER_RUST_VERSION" --profile minimal
          rustup default "$APK_BUILDER_RUST_VERSION"
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version

      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 1 100))"

          "$sdkmanager" \
            "platforms;android-$APK_BUILDER_ANDROID_API" \
            "build-tools;$APK_BUILDER_BUILD_TOOLS_VERSION" \
            "ndk;$APK_BUILDER_NDK_VERSION" \
            "cmake;$APK_BUILDER_SDK_CMAKE_FOR_NINJA"

          test -d "$ANDROID_HOME/ndk/$APK_BUILDER_NDK_VERSION"

      - name: Provision the pinned CMake from upstream
        run: |
          set -euo pipefail
          archive="cmake-$APK_BUILDER_CMAKE_VERSION-linux-x86_64.tar.gz"
          url="https://github.com/Kitware/CMake/releases/download/v$APK_BUILDER_CMAKE_VERSION/$archive"

          curl --fail --silent --show-error --location --output "$archive" "$url"
          echo "$APK_BUILDER_CMAKE_SHA256  $archive" | sha256sum --check --strict

          install --directory "$HOME/cmake-$APK_BUILDER_CMAKE_VERSION"
          tar --extract --gzip --file "$archive" \
            --directory "$HOME/cmake-$APK_BUILDER_CMAKE_VERSION" --strip-components=1

          cp "$ANDROID_HOME/cmake/$APK_BUILDER_SDK_CMAKE_FOR_NINJA/bin/ninja" \
             "$HOME/cmake-$APK_BUILDER_CMAKE_VERSION/bin/ninja"

          reported=$("$HOME/cmake-$APK_BUILDER_CMAKE_VERSION/bin/cmake" --version | head -1)
          echo "$reported"
          test "$reported" = "cmake version $APK_BUILDER_CMAKE_VERSION"

      - name: Point the build at the provisioned toolchains
        env:
          APK_BUILDER_SIGNING_CERT_SHA256: ${{ secrets.APK_BUILDER_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "cmake.dir=$HOME/cmake-$APK_BUILDER_CMAKE_VERSION"
          } > local.properties
          cat local.properties

      - name: Provision the release signing key
        env:
          APK_BUILDER_KEYSTORE_BASE64: ${{ secrets.APK_BUILDER_KEYSTORE_BASE64 }}
          APK_BUILDER_KEYSTORE_PASSWORD: ${{ secrets.APK_BUILDER_KEYSTORE_PASSWORD }}
          APK_BUILDER_KEY_ALIAS: ${{ secrets.APK_BUILDER_KEY_ALIAS }}
          APK_BUILDER_KEY_PASSWORD: ${{ secrets.APK_BUILDER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APK_BUILDER_KEYSTORE_BASE64:-}" ]; then
            echo "No signing secrets are configured."
            echo "The release APK will be built unsigned and cannot be installed."
            echo "Add APK_BUILDER_KEYSTORE_BASE64, APK_BUILDER_KEYSTORE_PASSWORD, APK_BUILDER_KEY_ALIAS"
            echo "and APK_BUILDER_KEY_PASSWORD as repository secrets to change that."
            exit 0
          fi

          store="$RUNNER_TEMP/builder-release.jks"

          printf '%s' "$APK_BUILDER_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | sed 's/^=*//' \
            | base64 --decode > "$store"
          test -s "$store"

          if ! keytool -list -keystore "$store" \
                -storepass "$APK_BUILDER_KEYSTORE_PASSWORD" \
                -alias "$APK_BUILDER_KEY_ALIAS" > /dev/null 2>&1; then
            decoded=$(wc -c < "$store")
            echo "APK_BUILDER_KEYSTORE_BASE64 did not decode into a usable keystore."
            echo
            echo "It decoded to $decoded bytes, which narrows it down:"
            echo
            echo "  Right size, still refused -> a character in the secret was"
            echo "  altered in transit. One is enough, and the result decodes to"
            echo "  the correct length, so size proves nothing. Re-copy the whole"
            echo "  value from the file it was delivered in rather than hunting"
            echo "  for the character."
            echo
            echo "  Wrong size -> the copy was partial, or it picked up text"
            echo "  around the value. A partial copy decodes without complaint."
            echo
            echo "  Either way, also confirm APK_BUILDER_KEYSTORE_PASSWORD and"
            echo "  APK_BUILDER_KEY_ALIAS belong to this key."
            exit 1
          fi

          keytool -list -keystore "$store" \
            -storepass "$APK_BUILDER_KEYSTORE_PASSWORD" \
            -alias "$APK_BUILDER_KEY_ALIAS" 2>/dev/null | grep -i "fingerprint" || true

          {
            echo "APK_BUILDER_SIGNING_STORE_FILE=$store"
            echo "APK_BUILDER_SIGNING_STORE_PASSWORD=$APK_BUILDER_KEYSTORE_PASSWORD"
            echo "APK_BUILDER_SIGNING_KEY_ALIAS=$APK_BUILDER_KEY_ALIAS"
            echo "APK_BUILDER_SIGNING_KEY_PASSWORD=$APK_BUILDER_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing is configured."

      # Assembling depends on all three anyway. Running them first, in one
      # invocation rather than three, fails on a toolchain that drifted before
      # anything is compiled and pays Gradle's start-up once.
      - name: Verify the toolchains against the lock
        run: |
          ./gradlew --console=plain \
            verifyToolchainLock \
            :Builder:verifyCmakeToolchain \
            :Builder:verifyKotlinToolchain

      # rustfmt and clippy belong to the Core job, which installs them and has
      # nothing else to wait for. What is left here is what needs the Android
      # build: the package and the bundle first, then the Core suite reading
      # the real package this job just produced.
      - name: Run every check that needs the Android build
        run: ./Builder_Test.py --strict release core bridge installable reproducible

      - name: Report what the release artifacts are
        run: |
          set -euo pipefail
          apk=$(ls Builder/build/outputs/apk/release/*.apk)
          aab=$(ls Builder/build/outputs/bundle/release/*.aab)
          echo "Release artifacts: $(basename "$apk") and $(basename "$aab")"
          echo "SHA-256: $(sha256sum "$apk" | cut -d' ' -f1)"
          echo "SHA-256: $(sha256sum "$aab" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/$APK_BUILDER_BUILD_TOOLS_VERSION/apksigner" verify \
            --print-certs "$apk" || {
              echo
              echo "This artifact is NOT signed and cannot be installed."
              echo "Add the APK_BUILDER_KEYSTORE_* repository secrets to get a signed one."
            }

      - name: Publish the package and the bundle
        uses: actions/upload-artifact@v5
        with:
          name: apk-builder-release
          path: |
            Builder/build/outputs/apk/release/*.apk
            Builder/build/outputs/bundle/release/*.aab
          if-no-files-found: error
